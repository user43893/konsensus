name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scanner_release="$(
            bash scripts/repository/resolve-scanner-release.sh gitleaks
          )"
          IFS=$'\t' read -r archive_name archive_sha256 <<< "$scanner_release"
          test "$scanner_release" = "$archive_name"$'\t'"$archive_sha256"
          archive="$RUNNER_TEMP/$archive_name"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive_name"
          echo "$archive_sha256  $archive" \
            | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/gitleaks-8.30.1"
          tar --extract --gzip --file "$archive" \
            --directory "$RUNNER_TEMP/gitleaks-8.30.1" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks-8.30.1/gitleaks" \
            >> "$GITHUB_ENV"

      - name: Self-test and run Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          test "$("$GITLEAKS_BIN" version)" = "8.30.1"
          self_test="$RUNNER_TEMP/gitleaks-self-test"
          mkdir "$self_test"
          printf '%s%s%s\n' \
            'api_key="' \
            'xY7pQ2mN9vK4cR8tL3wF6sH1' \
            'jD5bG0zA"' \
            > "$self_test/must-be-detected.txt"
          set +e
          "$GITLEAKS_BIN" dir \
            --no-banner \
            --redact \
            --config .gitleaks.toml \
            "$self_test"
          self_test_status=$?
          set -e
          test "$self_test_status" -eq 1
          "$GITLEAKS_BIN" dir \
            --no-banner \
            --redact \
            --config .gitleaks.toml \
            .

      - name: Install checksum-pinned TruffleHog
        shell: bash
        run: |
          set -euo pipefail
          scanner_release="$(
            bash scripts/repository/resolve-scanner-release.sh trufflehog
          )"
          IFS=$'\t' read -r archive_name archive_sha256 <<< "$scanner_release"
          test "$scanner_release" = "$archive_name"$'\t'"$archive_sha256"
          archive="$RUNNER_TEMP/$archive_name"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.9/$archive_name"
          echo "$archive_sha256  $archive" \
            | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/trufflehog-3.95.9"
          tar --extract --gzip --file "$archive" \
            --directory "$RUNNER_TEMP/trufflehog-3.95.9" trufflehog
          echo "TRUFFLEHOG_BIN=$RUNNER_TEMP/trufflehog-3.95.9/trufflehog" \
            >> "$GITHUB_ENV"

      - name: Self-test and run independent credential scan
        shell: bash
        run: |
          set -euo pipefail
          self_test="$RUNNER_TEMP/trufflehog-self-test"
          mkdir "$self_test"
          printf '%s%s%s%s\n' \
            'postgres' \
            '://publication_canary:' \
            'not-a-real-secret' \
            '@db.example.test:5432/database' \
            > "$self_test/must-be-detected.txt"
          set +e
          "$TRUFFLEHOG_BIN" filesystem \
            --no-update \
            --no-verification \
            --results=unverified \
            --fail \
            --fail-on-scan-errors \
            "$self_test" \
            > "$RUNNER_TEMP/trufflehog-self-test-output" 2>&1
          self_test_status=$?
          set -e
          test "$self_test_status" -eq 183
          scan_report="$RUNNER_TEMP/trufflehog-scan-output"
          set +e
          "$TRUFFLEHOG_BIN" filesystem \
            --no-update \
            --results=verified \
            --fail \
            --fail-on-scan-errors \
            . \
            > "$scan_report" 2>&1
          scan_status=$?
          set -e
          rm -f "$scan_report"
          if test "$scan_status" -eq 183; then
            echo "::error::TruffleHog found a verified credential."
            exit 1
          fi
          if test "$scan_status" -ne 0; then
            echo "::error::TruffleHog failed closed while scanning the repository."
            exit 1
          fi
